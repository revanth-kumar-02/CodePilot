services:
  - type: web
    name: codepilot-backend
    env: node
    region: oregon
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_ANALYSIS_KEY
        sync: false
      - key: GROQ_CODE_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
