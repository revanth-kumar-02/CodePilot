  <title>Task Overview: Matrix Rotation</title>

<body>
  <h1>Problem Statement</h1>
  <p>Rotate the given N x N 2D matrix by 90 degrees clockwise in-place.</p>
  
  <h2>Input Format</h2>
  <p>Matrix dimension N followed by N lines of N integers.</p>
  
  <h2>Output Format</h2>
  <p>The rotated matrix elements.</p>
  
  <h2>Constraints</h2>
  <p>1 <= N <= 500</p>
</body>
