<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multiple Examples Task</title>
</head>
<body>
  <main>
    <h1>Two Sum Variant</h1>
    <h2>Problem Statement</h2>
    <p>Find two numbers in an array that sum to target.</p>

    <h2>Examples</h2>
    <div class="example">
      <p><strong>Example 1:</strong></p>
      <pre className="input">2 7 11 15</pre>
      <pre className="output">0 1</pre>
    </div>
    <div class="example">
      <p><strong>Example 2:</strong></p>
      <pre className="input">3 2 4</pre>
      <pre className="output">1 2</pre>
    </div>
    <div class="example">
      <p><strong>Example 3:</strong></p>
      <pre className="input">3 3</pre>
      <pre className="output">0 1</pre>
    </div>
  </main>
</body>
</html>
